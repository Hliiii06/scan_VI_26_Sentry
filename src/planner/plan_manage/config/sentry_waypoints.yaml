# Mode 2：参数航点。
# 场地：x=-6.0 是 rmuc2026_field.pcd 中一条约 7 m 长、0.75 m 净空的南北向通道。
# 航点沿 +Y 排列而机头保持 yaw=0，因此该模式同时就是"车头不变横移"的测试用例。
# z = 0.125 为机体中心高度（机体高 0.25 m，地面 z=0）。
#
# 注意：第一个航点不能与机器人初始位置重合。FSM 从当前位姿规划到 fsm.waypoints
# 的第一个点，起点=终点时多项式轨迹退化，规划失败（表现为反复重规划后急停）。
# 本文件默认初始位姿是 (-6.0, 1.25)，因此第一个航点从 y=3.5 开始。
/sentry_sim/scan_planner_node:
  ros__parameters:
    fsm.navi_mode: 2
    fsm.waypoints:
      [-6.0, 3.50, 0.125,
       -6.0, 5.50, 0.125,
       -6.0, 7.50, 0.125]
